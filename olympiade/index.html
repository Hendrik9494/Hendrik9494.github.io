<script>
(()=>{'use strict';
const KEY='olympiade-ipad-v1', TYPES={ranking:{label:'Rangliste',icon:'≡',sub:'Platzierungen manuell vergeben'},time:{label:'Zeit',icon:'⏱',sub:'Kürzeste Zeit gewinnt'},points:{label:'Punkte',icon:'◎',sub:'Höchster Punktestand gewinnt'},duel:{label:'K.-o.-Duelle',icon:'⚔',sub:'12 Duelle für alle 8 Platzierungen'}};
const makeId=()=> (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state;try{let obj=JSON.parse(localStorage.getItem(KEY));if(obj&&Array.isArray(obj.tournaments)&&obj.tournaments.length)state=obj}catch(e){}if(!state){let t=initialTournament();state={version:1,activeId:t.id,tournaments:[t]}}
const ui={page:'home',gameId:null,filter:'all',modal:null};

const fun=()=>state.fun;

'{name}, heute lief es nicht rund. Eigentlich lief überhaupt nichts.',

function makeConfetti(){if(!fun().confetti)return '';let a='';const colors=['#c8f66d','#fd8855','#77b9f5','#e6ba59','#d6a5e8'];for(let i=0;i<36;i++)a+='<span style="--x:'+((i*37)%100)+'%;--d:'+((i*13)%7/10)+'s;--r:'+((i*41)%360)+'deg;--c:'+colors[i%5]+'"></span>';return '<div class="fun-burst" aria-hidden="true">'+a+'</div>'}
function soundEffect(){if(!fun().enabled||!fun().sounds)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();ctx.resume();const start=ctx.currentTime;[392,330,262].forEach((hz,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='triangle';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,start+i*.16);gain.gain.exponentialRampToValueAtTime(.12,start+i*.16+.015);gain.gain.exponentialRampToValueAtTime(.0001,start+i*.16+.24);osc.connect(gain);gain.connect(ctx.destination);osc.start(start+i*.16);osc.stop(start+i*.16+.25)});setTimeout(()=>ctx.close().catch(()=>{}),1400)}catch(e){}}
function speakJoke(line,append=false){if(!fun().voice||!line)return;if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('Keine Sprachausgabe auf diesem Gerät verfügbar.');return}try{if(!append)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(line);u.lang='de-DE';u.rate=.94;u.pitch=.88;const voices=speechSynthesis.getVoices(),de=voices.find(v=>String(v.lang).toLowerCase().startsWith('de'));if(de)u.voice=de;speechSynthesis.speak(u)}catch(e){toast('Sprachausgabe konnte nicht gestartet werden.')}}
function showTaunt(t,g,rr,preview=false,commentary=''){
if(!fun().enabled&&!fun().commentator&&!preview)return;
if(!Array.isArray(rr)||rr.length!==8)return;
const top=Math.max(...rr.map(r=>r.score)),bottom=Math.min(...rr.map(r=>r.score));
const winner=rr.filter(r=>Math.abs(r.score-top)<1e-7).map(r=>playerName(t,r.id)).join(' & ');
const losers=rr.filter(r=>Math.abs(r.score-bottom)<1e-7).map(r=>playerName(t,r.id));
let joke;
if(losers.length===8)joke='Acht Spieler, achtmal Gleichstand. Wenigstens seid ihr gemeinsam mittelmäßig.';
else if(losers.length>1)joke=losers.join(' & ')+', ihr teilt euch die Rote Laterne. Wie großzügig.';
else joke=JOKES[Math.floor(Math.random()*JOKES.length)].replace('{name}',losers[0]);
lastJoke=fun().enabled||preview?joke:'';lastComment=fun().commentator||preview?commentary:'';
const box=document.getElementById('modal-root');
box.innerHTML='<div class="fun-overlay" data-action="close-backdrop"><section class="fun-card" role="dialog" aria-modal="true" aria-label="Sieg und Rote Laterne">'+makeConfetti()+'<div class="fun-emblem">🏆</div><div class="fun-eyebrow">'+(preview?'TESTMODUS':'DISZIPLIN ABGESCHLOSSEN')+'</div><h2>'+esc(g.title)+'</h2><div class="fun-winner">🥇 Sieger: <strong>'+esc(winner)+'</strong></div>'+(lastComment?'<div class="fun-commentary" aria-live="polite"><strong>🎙 Live-Kommentator</strong>'+esc(lastComment)+'</div>':'')+(lastJoke?'<div class="fun-joke" aria-live="polite">'+esc(lastJoke)+'</div>':'')+'<div class="fun-actions"><button class="btn" data-action="repeat-joke">🔊 Nochmal abspielen</button><button class="btn lime" data-action="close-modal">Weiter →</button></div></section></div>';
soundEffect();if(lastComment)speakJoke(lastComment);if(lastJoke)speakJoke(lastJoke,!!lastComment);
}

function showAwards(t){if(!doneCount(t))return toast('Erst eine Disziplin abschließen.');const ss=scores(t),top=ss[0],last=ss.at(-1),podium=ss.slice().sort((a,b)=>b.podiums-a.podiums||b.wins-a.wins)[0];const award=(symbol,title,p,subtitle)=>'<div class="fun-award"><div class="fun-award-icon">'+symbol+'</div><div><strong>'+title+': '+esc(p.name)+'</strong><small>'+subtitle+'</small></div></div>';document.getElementById('modal-root').innerHTML='<div class="fun-overlay" data-action="close-backdrop"><section class="fun-card" role="dialog" aria-modal="true" aria-label="Spaß-Siegerehrung"><div class="fun-emblem">🏅</div><div class="fun-eyebrow">INOFFIZIELLE AUSZEICHNUNGEN</div><h2>Die Helden des Wochenendes</h2>'+award('👑','Ober-Olympionike',top,fmt(top.total)+' Punkte · '+top.wins+' Siege')+award('🎖️','Podiums-Abonnent',podium,podium.podiums+' Podiumsplätze')+award('🏮','Rote Laterne',last,fmt(last.total)+' Punkte · hält von hinten alles zusammen')+'<div class="fun-actions" style="margin-top:24px"><button class="btn lime" data-action="close-modal">Schließen</button></div></section></div>'}

const save=()=>{try{active().updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Speichern fehlgeschlagen – Speicherplatz prüfen.');return false}};
const toast=msg=>{document.querySelector('#toast-root').innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>document.querySelector('#toast-root').innerHTML='',2800)};
const go=(page,gameId=null)=>{ui.page=page;ui.gameId=gameId;render();window.scrollTo(0,0)};
const modeIcon=mode=>TYPES[mode]?.icon||'★';
const ranked=(players,rawValues,ascending=true)=>{const vals=players.map(p=>({id:p.id,value:rawValues[p.id]}));if(vals.some(x=>x.value===null||x.value===undefined||!Number.isFinite(x.value)))return null;vals.sort((a,b)=>ascending?a.value-b.value:b.value-a.value);let out=[],i=0;while(i<vals.length){let j=i+1;while(j<vals.length&&Math.abs(vals[i].value-vals[j].value)<1e-8)j++;let pos=i+1,points=0;for(let k=i;k<j;k++)points+=9-(k+1);points=points/(j-i);for(let k=i;k<j;k++)out.push({id:vals[k].id,rank:pos,score:points,value:vals[k].value});i=j}return out};
function parseTime(v){v=String(v??'').trim().replace(',','.');if(!v)return null;let a=v.split(':');if(a.length>3||a.some(s=>!/^[0-9]+(?:\.[0-9]+)?$/.test(s)))return null;let nums=a.map(Number);if(nums.length>1&&(nums[nums.length-1]>=60||nums[nums.length-2]>=60&&nums.length===3))return null;let total=nums.reduce((sum,n)=>sum*60+n,0);return Number.isFinite(total)&&total>=0?total:null}
function parseNumber(v){let s=String(v??'').trim().replace(',','.');if(!s||!/^[-+]?\d+(?:\.\d+)?$/.test(s))return null;let n=Number(s);return Number.isFinite(n)?n:null}
const brackets=[{title:'Viertelfinale',items:['q1','q2','q3','q4']},{title:'Halbfinale · obere Hälfte',items:['sw1','sw2']},{title:'Halbfinale · untere Hälfte',items:['sl1','sl2']},{title:'Platzierungsspiele',items:['f1','f3','f5','f7']}];
function bracketData(t,g){let s=g.seeds||t.players.map(p=>p.id),w=g.winners||{};let m={},clean={},both=(id,a,b)=>{m[id]=[a||null,b||null];if(a&&b&&a!==b&&([a,b].includes(w[id])))clean[id]=w[id]};let win=id=>clean[id]||null,lose=id=>{let x=m[id]||[];return win(id)?x.find(p=>p!==win(id))||null:null};
['q1','q2','q3','q4'].forEach((id,i)=>both(id,s[i*2],s[i*2+1]));both('sw1',win('q1'),win('q2'));both('sw2',win('q3'),win('q4'));both('sl1',lose('q1'),lose('q2'));both('sl2',lose('q3'),lose('q4'));both('f1',win('sw1'),win('sw2'));both('f3',lose('sw1'),lose('sw2'));both('f5',win('sl1'),win('sl2'));both('f7',lose('sl1'),lose('sl2'));
let standings=null;if(Object.keys(clean).length===12){standings=[];[1,3,5,7].forEach(r=>{standings.push({id:win('f'+r),rank:r,score:9-r});standings.push({id:lose('f'+r),rank:r+1,score:8-r})})}return{matches:m,winners:clean,standings};}
function results(t,g){if(g.mode==='duel')return bracketData(t,g).standings;
let vals={};for(let p of t.players){let v=g.values?.[p.id];let n=g.mode==='ranking'?parseNumber(v):g.mode==='time'?parseTime(v):parseNumber(v);if(n===null||g.mode==='ranking'&&(n<1||n>8||!Number.isInteger(n)))return null;vals[p.id]=n}
return ranked(t.players,vals,g.mode==='ranking'||g.mode==='time'||(g.mode==='points'&&g.lowWins));}
function scores(t){let score=Object.fromEntries(t.players.map(p=>[p.id,{id:p.id,name:p.name,total:0,games:0,wins:0,podiums:0,second:0,third:0}]));for(let g of t.games){if(g.status!=='done')continue;let rr=results(t,g);if(!rr)continue;for(let r of rr){let a=score[r.id];if(!a)continue;a.total+=r.score;a.games++;if(r.rank===1)a.wins++;if(r.rank<=3)a.podiums++;if(r.rank===2)a.second++;if(r.rank===3)a.third++}}
return Object.values(score).sort((a,b)=>b.total-a.total||b.wins-a.wins||b.podiums-a.podiums||a.name.localeCompare(b.name,'de'));}
const doneCount=t=>t.games.filter(g=>g.status==='done'&&results(t,g)).length;

function commentatorLine(t,g,rr,before,after){
 const best=Math.max(...rr.map(r=>r.score));
 const winners=rr.filter(r=>Math.abs(r.score-best)<1e-7).map(r=>playerName(t,r.id));
 const winner=winners.join(' und ');
 if(!before.length)return 'Was für ein Auftakt! '+winner+' gewinnt '+g.title+'. Die Jagd nach dem Gesamtsieg ist eröffnet!';
 if(before[0].id!==after[0].id)return 'Führungswechsel! '+after[0].name+' übernimmt mit '+fmt(after[0].total)+' Punkten die Spitze. '+before[0].name+' muss den Thron räumen!';
 const moved=after.map(x=>({name:x.name,old:rankOf(before,x.id),now:rankOf(after,x.id)}));
 const rise=moved.slice().sort((a,b)=>(b.old-b.now)-(a.old-a.now))[0];
 const fall=moved.slice().sort((a,b)=>(b.now-b.old)-(a.now-a.old))[0];
 if(rise.old-rise.now>=2)return 'Das Comeback des Tages! '+rise.name+' klettert von Platz '+rise.old+' auf Platz '+rise.now+'. Da geht noch was!';
 if(fall.now-fall.old>=2)return 'Alarmstufe Rot! '+fall.name+' rutscht von Platz '+fall.old+' auf Platz '+fall.now+'. Die Konkurrenz zeigt keinerlei Mitleid.';
 return winner+' holt den Disziplin-Sieg bei '+g.title+'. Vorne bleibt '+after[0].name+' – aber wie lange noch?';
}

function settings(t){return `${header('Einstellungen','Turniere, Namen und Datensicherung')}<div class="twocol"><section class="panel"><h3 class="settings-subtitle">Teilnehmer bearbeiten</h3><p class="section-note">Acht Einzelspieler pro Olympiade. Namen könnt ihr jederzeit ändern.</p><div class="rename-grid">${t.players.map((p,i)=>`<label class="field"><span class="label">Spieler ${i+1}</span><input class="text-input player-name-input" maxlength="36" data-player="${p.id}" value="${esc(p.name)}" /></label>`).join('')}</div><div class="savebar"><span class="small">Änderungen gelten für alle Disziplinen.</span><button class="btn primary" data-action="save-names">Namen speichern</button></div></section><section class="panel"><h3 class="settings-subtitle">Olympiaden verwalten</h3><p class="section-note">Erstellt mehrere Olympiaden und wechselt später jederzeit zurück. Spielstände bleiben getrennt.</p><label class="field"><span class="label">Aktuelle Olympiade</span><select id="activeTournament" class="select-input">${state.tournaments.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="buttons" style="margin-top:14px">${button('create-tournament','+ Neue Olympiade','primary')}${button('rename-tournament','Umbenennen')}${button('delete-tournament','Löschen','danger')}</div><div class="line"></div><h3 class="settings-subtitle">Sichern & übertragen</h3><p class="section-note">Alle Turniere werden nur in diesem Browser auf diesem iPad gespeichert. Keine Anmeldung, kein Internet zur Ergebniseingabe nötig (nach der ersten Online-Installation).</p><div class="buttons">${button('export','↓ Sicherung exportieren','lime')}${button('import','↑ Sicherung importieren')}</div><div class="warning" style="margin-top:15px"><strong>Wichtig:</strong> Browserdaten oder das Löschen der App können die Daten entfernen. Exportiert zur Sicherheit regelmäßig eine JSON-Datei in „Dateien“ oder iCloud Drive. Ein Import ersetzt den bisherigen Gesamtbestand.</div></section></div>${funSettingsHTML()}<div class="panel" style="margin-top:20px"><h3 class="settings-subtitle">Punktesystem</h3><div class="section-note">In jeder fertig gespielten Disziplin erhalten die Plätze 1 bis 8 jeweils 8, 7, 6, 5, 4, 3, 2 und 1 Punkte. Bei identischen Zeiten, Punktzahlen oder Platzierungsangaben werden die betroffenen Platzierungspunkte gemittelt. K.-o.-Duelle bestehen aus 12 Partien, sodass alle acht Plätze ausgespielt werden.</div></div>`}
function previewHtml(t,g){let res=results(t,g);return res?`<div class="score-preview">${res.slice().sort((a,b)=>a.rank-b.rank).map(r=>`<div class="preview-row"><span class="place">${r.rank}</span><strong>${name(t,r.id)}</strong><span class="preview-points">+${fmt(r.score)} P</span></div>`).join('')}</div>`:'<div class="empty">Noch nicht alle Ergebnisse vorhanden.<br/>Sobald alle acht Platzierungen feststehen, erscheint hier die Punkteverteilung.</div>'}
function updateGamePreview(){let t=active(),g=t.games.find(x=>x.id===ui.gameId);if(!g)return;let preview=document.getElementById('result-preview');if(preview)preview.innerHTML=previewHtml(t,g);let finish=document.querySelector('[data-action="finish"]');if(finish)finish.disabled=!results(t,g)}
function gamePage(t,g){let res=results(t,g),done=g.status==='done',mark=done?'<span class="pill done">✓ Abgeschlossen</span>':'<span class="pill live">● In Bearbeitung</span>';let form='';
if(g.mode==='duel')form=duelEditor(t,g);
else form=`<div class="info">${g.mode==='ranking'?'Wählt für jeden Spieler den erreichten Rang. Bei gleichen Rangzahlen werden geteilte Plätze automatisch berücksichtigt.':g.mode==='time'?'Tragt die Zeiten ein. Format: <strong>1:23,45</strong> für 1 Minute 23,45 Sekunden. Die schnellste Zeit gewinnt.':'Tragt die erzielten Punkte ein. '+(g.lowWins?'Die niedrigste Punktzahl gewinnt.':'Die höchste Punktzahl gewinnt.')}</div>${g.mode==='points'?`<label class="category-info" style="margin-top:18px"><span class="label">Wertungsrichtung</span><label><input type="checkbox" id="lowWins" ${g.lowWins?'checked':''} /> Niedrigste Punktzahl gewinnt</label></label>`:''}<div style="margin-top:17px">${t.players.map((p,i)=>`<label class="game-result-row"><div class="resultname"><span class="avatar">${i+1}</span><span>${esc(p.name)}</span></div>${g.mode==='ranking'?`<select class="select-input" data-value-player="${p.id}"><option value="">Rang wählen</option>${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${String(g.values?.[p.id]??'')===String(i+1)?'selected':''}>Platz ${i+1}</option>`).join('')}</select>`:`<input class="text-input" data-value-player="${p.id}" type="text" inputmode="${g.mode==='time'?'decimal':'decimal'}" placeholder="${g.mode==='time'?'mm:ss,ss':'Punkte'}" value="${esc(g.values?.[p.id]??'')}" />`}</label>`).join('')}</div>`;
let prev=previewHtml(t,g);
return `${header('Disziplin bearbeiten',TYPES[g.mode].label,button('back-games','← Disziplinen','sm'))}<div class="panel"><div class="panel-title"><div><h2 style="font-size:26px;letter-spacing:-.6px;margin:0 0 8px">${modeIcon(g.mode)} ${esc(g.title)}</h2>${mark}</div><button class="btn sm" data-action="rename-game">✎ Umbenennen</button></div><div class="game-layout"><div><h3 class="settings-subtitle">${g.mode==='duel'?'K.-o.-Spielplan':'Ergebnisse eintragen'}</h3>${form}</div><div><h3 class="settings-subtitle">Punkte-Vorschau</h3><div id="result-preview">${prev}</div></div></div><div class="foot-actions"><div class="buttons"><button class="btn danger" data-action="delete-game">Disziplin löschen</button>${g.mode==='duel'?button('shuffle','⇄ Paarungen neu mischen'):''}</div><div class="buttons">${done?button('reopen','Wieder öffnen'):''}<button class="btn ${done?'':'lime'}" data-action="finish" ${!res?'disabled':''}>${done?'✓ Abgeschlossen':'✓ Disziplin abschließen'}</button></div></div>${done?'<div class="leader-highlight" style="margin-top:16px">Diese Disziplin fließt in die Gesamtwertung ein. Korrekturen werden automatisch übernommen.</div>':''}</div>`}
function duelEditor(t,g){const d=bracketData(t,g);return `<div class="info">Tippt pro Duell auf den Sieger. Das System ermittelt automatisch alle acht Plätze. Gleichstand ist im K.-o.-Modus nicht möglich.</div><div style="margin-top:19px">${brackets.map(b=>`<section class="bracket-block"><h3>${b.title}</h3><div class="matches">${b.items.map((id)=>{let pair=d.matches[id];let label={q1:'Viertelfinale 1',q2:'Viertelfinale 2',q3:'Viertelfinale 3',q4:'Viertelfinale 4',sw1:'Sieger-HF 1',sw2:'Sieger-HF 2',sl1:'Verlierer-HF 1',sl2:'Verlierer-HF 2',f1:'Finale · Platz 1/2',f3:'Spiel um Platz 3/4',f5:'Spiel um Platz 5/6',f7:'Spiel um Platz 7/8'}[id];return `<div class="match"><div class="match-label">${label}</div>${pair.every(Boolean)?`<div class="match-players"><button class="match-player ${d.winners[id]===pair[0]?'chosen':''}" data-action="set-winner" data-match="${id}" data-id="${pair[0]}">${name(t,pair[0])}</button><span class="match-vs">VS</span><button class="match-player ${d.winners[id]===pair[1]?'chosen':''}" data-action="set-winner" data-match="${id}" data-id="${pair[1]}">${name(t,pair[1])}</button></div>`:'<div class="match-placeholder">Vorherige Runde abschließen</div>'}</div>`}).join('')}</div></section>`).join('')}</div><p class="section-note">Viertelfinal-Sieger spielen die Plätze 1–4 aus; Verlierer die Plätze 5–8. Die Paarungen lassen sich vor oder während des Turniers neu auslosen (dadurch werden bisherige Ergebnisse gelöscht).</p>`}
function render(){let t=active();nav();document.title=t.name+' · Olympiade';const main=document.querySelector('#content');main.innerHTML=ui.page==='home'?home(t):ui.page==='games'?games(t):ui.page==='standings'?standings(t):ui.page==='settings'?settings(t):ui.page==='game'&&t.games.some(g=>g.id===ui.gameId)?gamePage(t,t.games.find(g=>g.id===ui.gameId)):home(t);if(ui.page==='standings'&&doneCount(t))main.querySelector('.topline .buttons')?.insertAdjacentHTML('afterbegin',button('awards','🏅 Spaß-Siegerehrung','lime'));}
function openModal(body){document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="close-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" data-action="close-modal" aria-label="Schließen">×</button>${body}</section></div>`;document.querySelector('.modal input,.modal select')?.focus()}
const closeModal=()=>document.querySelector('#modal-root').innerHTML='';
function createGameModal(){openModal(`<h2 id="modal-title">Neue Disziplin</h2><p class="section-note">Legt einen Namen und die Wertungsart fest.</p><form id="new-game-form"><div class="form-field"><label class="label" for="new-game-name">Name der Disziplin</label><input required maxlength="65" class="text-input" id="new-game-name" placeholder="z. B. Dosenwerfen" /></div><div class="form-field"><label class="label" for="new-game-mode">Spielformat</label><select class="select-input" id="new-game-mode">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.label} – ${v.sub}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Abbrechen</button><button class="btn primary" type="submit">Disziplin erstellen</button></div></form>`)}
function textModal(title,label,current,formId){openModal(`<h2 id="modal-title">${esc(title)}</h2><form id="${formId}"><div class="form-field"><label class="label" for="edit-name">${esc(label)}</label><input class="text-input" id="edit-name" maxlength="65" required value="${esc(current)}" /></div><div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></form>`)}
function deleteConfirm(msg){return confirm(msg)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function changeValue(el){let t=active(),g=t.games.find(g=>g.id===ui.gameId);if(!g)return;g.values=g.values||{};g.values[el.dataset.valuePlayer]=el.value;let wasDone=g.status==='done';if(wasDone&&!results(t,g))g.status='draft';save();updateGamePreview();if(wasDone&&g.status==='draft'){let status=document.querySelector('.panel .pill.done');if(status){status.className='pill live';status.textContent='● In Bearbeitung'}let finish=document.querySelector('[data-action="finish"]');if(finish){finish.textContent='✓ Disziplin abschließen';finish.classList.add('lime')}document.querySelector('.leader-highlight')?.remove()}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;let act=btn.dataset.action,t=active(),g=t.games.find(x=>x.id===ui.gameId);
if(act==='save-fun'){readFunInputs();render();toast('Spaß-Modus gespeichert.');return}if(act==='fun-demo'){readFunInputs();let rr=t.players.map((p,i)=>({id:p.id,score:8-i}));showTaunt(t,{title:'Testdisziplin'},rr,true);return}if(act==='comment-demo'){readFunInputs();const rr=t.players.map((p,i)=>({id:p.id,score:8-i}));showTaunt(t,{title:'Kommentator-Test'},rr,true,'Eilmeldung! '+playerName(t,t.players[0].id)+' gewinnt die Testdisziplin. '+playerName(t,t.players[7].id)+' prüft inzwischen, ob es eine Rückerstattung für die Teilnahme gibt.');return}if(act==='repeat-joke'){soundEffect();if(lastComment)speakJoke(lastComment);if(lastJoke)speakJoke(lastJoke,!!lastComment);return}if(act==='awards'){showAwards(t);return}if(act==='nav'){go(btn.dataset.page);return}if(act==='filter'){ui.filter=btn.dataset.value;render();return}if(act==='create-game'){createGameModal();return}if(act==='open-game'){go('game',btn.dataset.id);return}if(act==='back-games'){go('games');return}if(act==='close-modal'||act==='close-backdrop'&&e.target===btn){closeModal();return}
if(act==='rename-game'&&g){textModal('Disziplin umbenennen','Name der Disziplin',g.title,'rename-game-form');return}
if(act==='delete-game'&&g){if(!deleteConfirm('„'+g.title+'“ wirklich löschen? Alle Ergebnisse und Punkte dieser Disziplin werden entfernt.'))return;t.games=t.games.filter(x=>x.id!==g.id);save();go('games');toast('Disziplin gelöscht.');return}
if(act==='finish'&&g){const rr=results(t,g);if(!rr)return toast('Es fehlen noch gültige Ergebnisse.');const wasDone=g.status==='done';const before=!wasDone&&doneCount(t)>0?scores(t):[];g.status='done';const after=scores(t);save();render();toast('Disziplin abgeschlossen. Punkte wurden verbucht.');if(!wasDone)showTaunt(t,g,rr,false,fun().commentator?commentatorLine(t,g,rr,before,after):'');return}
if(act==='reopen'&&g){g.status='draft';save();render();toast('Disziplin wieder geöffnet. Punkte vorläufig entfernt.');return}
if(act==='set-winner'&&g){let d=bracketData(t,g);let id=btn.dataset.match,who=btn.dataset.id;if(!d.matches[id].includes(who))return;g.winners={...d.winners,[id]:who};g.winners=bracketData(t,g).winners;if(g.status==='done'&&!results(t,g))g.status='draft';save();render();return}
if(act==='shuffle'&&g){if(!deleteConfirm('Paarungen neu auslosen? Alle bisherigen Duell-Ergebnisse dieser Disziplin gehen verloren.'))return;g.seeds=shuffle(t.players.map(p=>p.id));g.winners={};g.status='draft';save();render();toast('Neue Paarungen ausgelost.');return}
if(act==='save-names'){let inputs=[...document.querySelectorAll('[data-player]')],val=inputs.map(x=>x.value.trim());if(val.some(x=>!x))return toast('Bitte alle acht Spielernamen ausfüllen.');if(new Set(val.map(x=>x.toLocaleLowerCase('de-DE'))).size!==8)return toast('Jeder Spieler benötigt einen eindeutigen Namen.');for(let p of t.players)p.name=inputs.find(x=>x.dataset.player===p.id).value.trim();save();render();toast('Spielernamen gespeichert.');return}
if(act==='create-tournament'){textModal('Neue Olympiade','Name der Olympiade','Neue Olympiade','create-tournament-form');return}
if(act==='rename-tournament'){textModal('Olympiade umbenennen','Name der Olympiade',t.name,'rename-tournament-form');return}
if(act==='delete-tournament'){if(!deleteConfirm('„'+t.name+'“ wirklich endgültig löschen? Alle Disziplinen und Ergebnisse dieser Olympiade werden entfernt.'))return;state.tournaments=state.tournaments.filter(x=>x.id!==t.id);if(!state.tournaments.length)state.tournaments.push(initialTournament('Neue Olympiade'));state.activeId=state.tournaments[0].id;save();go('settings');toast('Olympiade gelöscht.');return}
if(act==='export'){let file=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='olympiade-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sicherung exportiert.');return}
if(act==='import'){document.getElementById('import-file').click();return}
});
document.addEventListener('submit',e=>{let id=e.target.id;if(!['new-game-form','rename-game-form','create-tournament-form','rename-tournament-form'].includes(id))return;e.preventDefault();let t=active();let v=(document.getElementById(id==='new-game-form'?'new-game-name':'edit-name')?.value||'').trim();if(!v)return toast('Bitte einen Namen eingeben.');if(id==='new-game-form'){let mode=document.getElementById('new-game-mode').value;if(!TYPES[mode])return;let g={id:makeId(),title:v,mode,status:'draft',createdAt:new Date().toISOString(),values:{},winners:{},lowWins:false,seeds:shuffle(t.players.map(p=>p.id))};t.games.push(g);save();closeModal();go('game',g.id);toast('Disziplin erstellt.');return}if(id==='rename-game-form'){let g=t.games.find(x=>x.id===ui.gameId);if(g)g.title=v;save();closeModal();render();return}if(id==='create-tournament-form'){let x=initialTournament(v);state.tournaments.push(x);state.activeId=x.id;save();closeModal();go('settings');toast('Neue Olympiade angelegt.');return}if(id==='rename-tournament-form'){t.name=v;save();closeModal();render();toast('Olympiade umbenannt.');return}});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('input[data-value-player]'))changeValue(el)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='activeTournament'){if(state.tournaments.some(t=>t.id===el.value)){state.activeId=el.value;save();go('home')}return}if(el.dataset.valuePlayer){changeValue(el);return}if(el.id==='lowWins'){let t=active(),g=t.games.find(x=>x.id===ui.gameId);if(!g)return;g.lowWins=el.checked;save();render();return}});
document.getElementById('import-file').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let data=JSON.parse(await f.text());if(!data||!Array.isArray(data.tournaments)||!data.tournaments.length||data.tournaments.some(t=>!t.id||!t.name||!Array.isArray(t.players)||t.players.length!==8||!Array.isArray(t.games)))throw new Error('Ungültiges Sicherungsformat');if(!confirm('Sicherung importieren? Der bisherige Bestand ALLER Olympiaden auf diesem iPad wird überschrieben.'))return;let activeId=data.tournaments.some(t=>t.id===data.activeId)?data.activeId:data.tournaments[0].id;state={version:1,activeId,tournaments:data.tournaments,fun:{...defaultFun(),...(data.fun&&typeof data.fun==='object'?data.fun:{})}};save();go('home');toast('Sicherung erfolgreich importiert.')}catch(err){toast('Import fehlgeschlagen: '+err.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{let n=JSON.parse(e.newValue);if(n?.tournaments?.length){state={...n,fun:{...defaultFun(),...(n.fun||{})}};render()}}catch(e){}});
render();if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body></html>
